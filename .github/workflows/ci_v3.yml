name: molecule v3 基础模型 · 续训 / 发版（CPU）

# v3.0 基础模型 CI：训练 → 导出 GGUF → 【10 天发版闸门】→ 自续训。
#
# 纪律（设计文档 §10 / §12.1）：v3.0 只夯骨干，什么高级功能都不接；目标 PPL<10，能生成通顺中文。
# 续训链：每轮从最近完成的 run 的 artifact 续训（resume-v3 检查点 + corpus-v3 语料 + assets-v3 时钟），
#   导出 GGUF 产物；累计训练时长（data/v3_clock.json）达到 10 天（240h）后才创建 GitHub Release v3.0
#   （封顶，绝不 3.1），之后停止自动续训；未到 10 天则每轮只导出产物 + 自续训累积。
#
# 鲁棒性设计（应对 CI 平台在训练中取消 run，cancel_actor=null 非人为）：
#   - 训练步骤 continue-on-error，软超时不阻断后续；单轮压短（默认 75min）。
#   - 抗取消持久化（核心）：每次周期存档 + 优雅退出(SIGTERM) 都把最新 checkpoint + 时钟 +
#     语料推到【仓库级滚动发布 v3-checkpoint】（gh release upload --clobber）。滚动发布不受单次
#     run 被取消影响——而 workflow 的 if:always artifact 上传在被取消时不会执行，不可靠。
#     下一轮 Resume 直接从滚动发布拉取，链自愈，10 天时钟按实际训练分钟准确累加。
#   - 续训步骤 if: always() 且【内部】读 v3_clock + STOP_V3 + 去重判闸门，不依赖上游 step 的 outputs；
#     去重：若已存在其它 in_progress 的 v3 run，则跳过本次续训，避免 continue-v3 分叉成多链。
#
# 触发：
#   - workflow_dispatch：手动启动首轮。
#   - repository_dispatch (continue-v3)：上一轮结束自动续训（需 actions:write 权限，已授予）。
# 停止开关：仓库变量 STOP_V3 置位 或 仓库根存在 STOP_V3 文件时，本轮结束后不再续训、也不发版。

on:
  workflow_dispatch:
    inputs:
      seq_len:
        description: "序列长度"
        required: false
        default: "256"
      batch:
        description: "全局 batch（序列数）"
        required: false
        default: "4"
      max_minutes:
        description: "单轮训练软时限（分钟），务必 < 平台回收边界与步骤硬限"
        required: false
        default: "75"
      save_every:
        description: "周期存档间隔（分钟）；默认 10=每 10 分钟落一帧并推滚动发布，抗 CI 取消最坏只丢 10 分钟"
        required: false
        default: "10"
  repository_dispatch:
    types: [continue-v3]

permissions:
  contents: write
  actions: write        # 续训自触发 repository_dispatch 需要 actions:write（否则 403）

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 120            # 单轮硬限；训练 80m + 安装/语料/导出/上传 余量
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_v3.txt

      - name: Offline self-test（回归护栏：增量 step 与全量 forward 一致等）
        timeout-minutes: 10
        continue-on-error: true
        run: |
          python tests/test_offline.py

      - name: Resume from rolling checkpoint（v3-checkpoint 滚动发布，抗取消）
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # 单一持久源：滚动发布 v3-checkpoint（checkpoint + 时钟 + 语料），抗取消；
          # 平台取消 run 时 if:always artifact 会丢失，但滚动发布是仓库级持久存储，不受影响。
          if gh release view v3-checkpoint >/dev/null 2>&1; then
            echo "从滚动发布 v3-checkpoint 续训..."
            gh release download v3-checkpoint -p "v3.pt" -D checkpoints 2>/dev/null || echo "[resume] 无 v3.pt"
            gh release download v3-checkpoint -p "v3_clock.json" -D data 2>/dev/null || echo "[resume] 无 v3_clock.json"
            gh release download v3-checkpoint -p "v3_*.bin" -D data 2>/dev/null || echo "[resume] 无语料 bin"
            gh release download v3-checkpoint -p "self_bpe_8192.json" -D data 2>/dev/null || echo "[resume] 无 BPE"
          else
            echo "无滚动检查点（首轮），从零开始训练。"
          fi
          echo "--- checkpoints ---"; ls -la checkpoints 2>/dev/null | head
          echo "--- data ---"; ls -la data 2>/dev/null | head

      - name: Train v3 基础模型（CPU，时间驱动停止，周期存档 + 抗取消持久化）
        timeout-minutes: 95
        continue-on-error: true
        env:
          OMP_NUM_THREADS: "4"
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 80m python -u train_v3.py \
            --seq_len "${{ inputs.seq_len || '256' }}" \
            --batch "${{ inputs.batch || '4' }}" \
            --max_minutes "${{ inputs.max_minutes || '75' }}" \
            --save_every "${{ inputs.save_every || '10' }}" \
            --resume

      - name: Upload resume + corpus + assets artifacts（每轮都留档，链自愈）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-v3
          path: checkpoints
          retention-days: 30
          if-no-files-found: warn

      - name: Upload corpus-v3（语料 bin + BPE，供下一轮复用，省构建）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-v3
          path: |
            data/v3_*.bin
            data/self_bpe_8192.json
          retention-days: 30
          if-no-files-found: warn

      - name: 模型冒烟评测（趋势监控，异常不阻塞）
        timeout-minutes: 20
        continue-on-error: true
        run: |
          timeout 18m python eval_v3.py --out eval_v3_result.json || echo "[eval] 异常跳过"
          python - <<'PY' || true
          import json
          try:
              d = json.load(open('eval_v3_result.json'))
              p = sum(1 for r in d if r['ok'])
              print('评测通过 %d/%d' % (p, len(d)))
          except Exception as e:
              print('eval status n/a:', e)
          PY

      - name: 记录 MetaRSI 调度（离线，零用户侧影响）
        timeout-minutes: 5
        continue-on-error: true
        run: |
          python - <<'PY' || true
          import torch, subprocess
          try:
              s = torch.load('checkpoints/v3.pt', map_location='cpu', weights_only=False)
              step = s.get('step', 0)
              loss = s.get('loss', 0.0)
          except Exception:
              step, loss = 0, 0.0
          subprocess.run(['python', 'metarsi.py', 'update',
                          '--step', str(step), '--loss', str(round(loss, 4))], check=False)
          subprocess.run(['python', 'metarsi.py', 'suggest'], check=False)
          PY

      - name: Export GGUF（f32 精确源 + f16 半精度发布版）
        timeout-minutes: 20
        continue-on-error: true
        run: |
          timeout 18m python export_gguf_v3.py --ckpt checkpoints/v3.pt \
            --out molecule-v3-source.gguf --quant f32 || echo "[export] f32 失败"
          timeout 18m python export_gguf_v3.py --ckpt checkpoints/v3.pt \
            --out molecule-v3.gguf --quant f16 || echo "[export] f16 失败"
          ls -lh molecule-v3*.gguf 2>/dev/null

      - name: Upload GGUF release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gguf-release-v3
          path: |
            molecule-v3-source.gguf
            molecule-v3.gguf
          retention-days: 30
          if-no-files-found: warn

      # ---- 10 天发版闸门 + 续训（合并，if:always 内部判 gate，链自愈）----
      - name: Release gate + 续训（累计训练 ≥10 天 → 发 v3.0 并停；否则续训）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STOP_V3: ${{ vars.STOP_V3 }}
        run: |
          set -uo pipefail
          HOURS=0
          if [ -f data/v3_clock.json ]; then
            HOURS=$(python -c "import json;print(round(json.load(open('data/v3_clock.json'))['total_minutes']/60.0,2))")
          fi
          echo "累计训练小时: $HOURS / 240（10 天）"

          CONTINUE=true
          # 去重：若已存在其它 in_progress 的 v3 run，跳过本次续训，避免 continue-v3 分叉成多链
          OTHER=$(gh run list --workflow "molecule v3 基础模型 · 续训 / 发版（CPU）" \
                    --status in_progress --json databaseId --jq \
                    '.[] | select(.databaseId != ${{ github.run_id }}) | .databaseId' | wc -l)
          if [ "${OTHER:-0}" -gt 0 ]; then
            echo "检测到其它活跃 v3 run（${OTHER} 个），跳过本次续训以免分叉。"
            CONTINUE=false
          fi
          # 停止开关：仓库变量 STOP_V3 置位，或根存在 STOP_V3 文件 → 停训不发版
          if [ -n "${STOP_V3:-}" ] || [ -f STOP_V3 ]; then
            echo "STOP_V3 置位：停止续训，不发版。"
            CONTINUE=false
          fi

          REACHED=$(python -c "print(1 if $HOURS>=240 else 0)")
          if [ "$REACHED" -eq 1 ] && [ ! -f STOP_V3 ]; then
            echo "已达 10 天，发版 v3.0 并停止自动续训。"
            TAG="v3.0"
            for f in molecule-v3-source.gguf molecule-v3.gguf; do
              if [ ! -f "$f" ]; then echo "缺少 $f，跳过发版"; CONTINUE=false; exit 0; fi
            done
            {
              echo "# molecule v3.0 · 统一熔铸混合骨干（基础模型）"
              echo
              echo "v3.0 是 molecule 系列第一个可交付的基础版本：Mamba+BinaryAttention 混合线性骨干，"
              echo "24 层 Mamba 线性递推 + 6 层 BinaryAttention（4:1），640d、块级权重共享、8192 byte-level BPE、DeepNorm α=2.78、MTP + Z-loss。"
              echo
              echo "本版本只夯骨干（设计文档 §10/§12.1）：什么高级功能都不接，目标 PPL<10、能生成通顺中文。"
              echo "System1 / 元认知 / 效价 / 认知调度器 / 工具调用 / 双轨记忆 / 潜空间推理均为 v3.5+ 的熔铸阶段。"
              echo
              echo "发布文件："
              echo "- molecule-v3.gguf：F16 半精度发布版（约 160MB，MInfer / llama.cpp 可直接加载）"
              echo "- molecule-v3-source.gguf：F32 精确源（MInfer 逐层混合精度量化用）"
              echo
              if [ -f eval_v3_result.json ]; then
                P=$(python -c "import json;d=json.load(open('eval_v3_result.json'));print('%d/%d'%(sum(1 for r in d if r['ok']),len(d)))")
                echo "评测通过：$P（同口径 20 题，仅趋势监控）"
              fi
              if [ -f data/v3_clock.json ]; then
                C=$(python -c "import json;c=json.load(open('data/v3_clock.json'));print('%d 轮 / %.0f 小时 / %.2fB token'%(c['runs'],c['total_minutes']/60.0,c['total_tokens']/1e9))")
                echo "训练累计：$C"
              fi
              if [ -f molecule_rsi_status.md ]; then
                echo; echo "## 训练调度状态（MetaRSI）"; cat molecule_rsi_status.md
              fi
            } > notes.md

            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release delete "$TAG" -y || true
              git push --delete origin "$TAG" >/dev/null 2>&1 || true
            fi
            gh release create "$TAG" --title "molecule v3.0（基础模型）" --notes-file notes.md \
              molecule-v3.gguf molecule-v3-source.gguf
            echo "release $TAG 完成"

            mkdir -p releases benchmarks
            cp notes.md "releases/${TAG}.md"
            [ -f eval_v3_result.json ] && cp eval_v3_result.json "benchmarks/${TAG}.json"
            git config user.email "ci@codecloud.dev"
            git config user.name "molecule CI"
            git add releases benchmarks
            if git diff --cached --quiet; then
              echo "无新版本数据可提交"
            else
              git pull --rebase origin main || git rebase origin/main || true
              git commit -m "data: release ${TAG} notes + benchmarks [skip ci]"
              git push origin HEAD:refs/heads/main
            fi
            CONTINUE=false
          else
            echo "未到 10 天，继续续训累积（本轮 GGUF 已导出为产物）。"
          fi

          if [ "$CONTINUE" = true ]; then
            echo "自动续训下一轮..."
            gh api repos/$GITHUB_REPOSITORY/dispatches -f event_type=continue-v3
          else
            echo "本轮为末轮，不再续训。"
          fi
