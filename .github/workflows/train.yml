name: Train molecule (CPU)

# 纯 CPU 训练 / 评测 全链路 CI。训练与打包分离为两个独立工作流，各自 ≤6h。
# 时间纪律（硬性，每一步都有严格时限）：
#   - train job：timeout-minutes 290；训练步用 `timeout 285m` + train.py --max_minutes 280 双保险。
#   - 评测 step：timeout-minutes 20。
# - matrix 并行对照两种数据混比（baseline vs mathcode_plus）。
# - 跨轮续训：resume artifact 从「最近一次 train.yml run（任意结论，只要含 resume 产物）」拉取并继续。
# - 达标（baseline 六项逐项超 SmolLM2）由独立的 package.yml 在建 draft Release。
# - 仅 GitHub Release，不推 HuggingFace。

on:
  workflow_dispatch:
    inputs:
      max_steps:
        description: "每个 variant 的最大训练步数（软时限优先于它）"
        required: false
        default: "400"
      global_tokens:
        description: "目标 global batch（token 数）；越小越快"
        required: false
        default: "16384"
      max_minutes:
        description: "单 variant 训练软时限（分钟），到点优雅停止并保存"
        required: false
        default: "280"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "NOTICE"

permissions:
  contents: read
  actions: read

jobs:
  # ----------------------------------------------------------------------
  # 训练 + 评测（matrix 对照两种数据混比，并行）。不含打包，整条 < 6h。
  # ----------------------------------------------------------------------
  train:
    name: train-${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 290          # 硬上限 < 6h 窗口
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            mix_general: "0.40"
            mix_math: "0.20"
            mix_code: "0.20"
            mix_reason: "0.10"
            mix_eq: "0.10"
          - variant: mathcode_plus   # 数学/代码加量对照
            mix_general: "0.30"
            mix_math: "0.25"
            mix_code: "0.25"
            mix_reason: "0.10"
            mix_eq: "0.10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gguf

      - name: Offline self-test (fast sanity gate, 秒级)
        timeout-minutes: 10
        run: |
          python tests/test_offline.py

      - name: Resume from previous run (任意结论，只要有 resume 产物)
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 取最近一次 train.yml run（不限定 success，避免「训练成功但打包失败」的 run 其 resume 被丢弃）
          RUN_ID=$(gh run list --workflow train.yml --limit 1 \
                    --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$RUN_ID" ]; then
            echo "Resuming from run $RUN_ID"
            gh run download "$RUN_ID" --name "resume-${{ matrix.variant }}" \
              --dir checkpoints || echo "no previous resume artifact"
          else
            echo "No previous run to resume from"
          fi

      - name: Train (CPU, 软时限双保险)
        timeout-minutes: 290
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
          OMP_NUM_THREADS: "4"
        run: |
          timeout 285m python train.py \
            --variant "${{ matrix.variant }}" \
            --max_steps "${{ inputs.max_steps || '400' }}" \
            --seq_len 256 \
            --global_tokens "${{ inputs.global_tokens || '16384' }}" \
            --max_minutes "${{ inputs.max_minutes || '280' }}" \
            --mix_general "${{ matrix.mix_general }}" \
            --mix_math "${{ matrix.mix_math }}" \
            --mix_code "${{ matrix.mix_code }}" \
            --mix_reason "${{ matrix.mix_reason }}" \
            --mix_eq "${{ matrix.mix_eq }}" \
            --resume

      - name: Evaluate vs SmolLM2-135M
        timeout-minutes: 20
        run: |
          timeout 18m python eval.py --out "eval_result_${{ matrix.variant }}.md"
          mv eval_status.json "eval_status_${{ matrix.variant }}.json"
          echo "---- eval_status_${{ matrix.variant }}.json ----"
          cat "eval_status_${{ matrix.variant }}.json"

      - name: Upload resume artifact (for next run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-${{ matrix.variant }}
          path: checkpoints
          retention-days: 30
          if-no-files-found: warn

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.variant }}
          path: |
            eval_result_${{ matrix.variant }}.md
            eval_status_${{ matrix.variant }}.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload model assets (config.json + tokenizer_map.json, 供打包)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.variant }}
          path: |
            config.json
            data/tokenizer_map.json
          retention-days: 30
          if-no-files-found: warn
