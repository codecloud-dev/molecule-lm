name: Train molecule (CPU)

# 纯 CPU 训练 / 评测 全链路 CI。训练与打包分离为两个独立工作流，各自 ≤6h。
# 蒸馏数据由独立的 distill.yml 在 CI 内 CPU 生成（5 域 matrix 并行），本工作流训练前
# 自动拉取「最近一次成功蒸馏」的 teacher_*.jsonl 并入；若蒸馏尚未产出则自动 fallback 纯种子语料。
# 时间纪律（硬性，每一步都有严格时限）：
#   - train job：timeout-minutes 360；训练步用 `timeout 285m` + train.py --max_minutes 280 双保险。
#   - 评测 step：timeout-minutes 20。
# - 跨轮续训：resume artifact 从「最近一次 train.yml run（任意结论，只要含 resume 产物）」拉取并继续。
# - 版本发布由独立的 package.yml 在建 GitHub Release（每次成功一个版本，VERSION 驱动，封顶 V1.0）。
# - 仅 GitHub Release，不推 HuggingFace。

on:
  workflow_dispatch:
    inputs:
      max_steps:
        description: "最大训练步数（软时限优先于它）"
        required: false
        default: "400"
      global_tokens:
        description: "目标 global batch（token 数）；越小越快"
        required: false
        default: "16384"
      max_minutes:
        description: "单 variant 训练软时限（分钟），到点优雅停止并保存"
        required: false
        default: "280"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "NOTICE"
      - "VERSION"
      - "STOP_AUTOTRAIN"

permissions:
  contents: read
  actions: read

jobs:
  # ----------------------------------------------------------------------
  # 训练 + 评测（单一 baseline variant，整条 < 6h，不含打包）。
  # ----------------------------------------------------------------------
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360          # = 6h 硬限边界（GitHub job 上限）；预算：前置40 + 训练285 + 评测20 = 345m < 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gguf

      - name: Offline self-test (fast sanity gate, 秒级)
        timeout-minutes: 10
        run: |
          python tests/test_offline.py

      - name: Resume from previous run (已完成 run，排除自身)
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 取最近一次「已完成」的 train.yml run，且排除当前 run（gh run list 会把自身排第一）。
          # 不限定 success：避免「训练成功但打包失败」的 run 其 resume 被丢弃。
          RUN_ID=$(gh run list --workflow train.yml \
                    --status success,failure,cancelled --limit 10 \
                    --json databaseId --jq \
                    '.[] | select(.databaseId != ${{ github.run_id }}) | .databaseId' \
                    | head -1 || true)
          if [ -n "$RUN_ID" ]; then
            echo "Resuming from run $RUN_ID"
            gh run download "$RUN_ID" --name "resume-baseline" \
              --dir checkpoints || echo "no previous resume artifact"
          else
            echo "No previous completed run to resume from (训练从零开始)"
          fi

      - name: Download distilled teacher data (最新成功蒸馏，可选)
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          DRUN=$(gh run list --workflow distill.yml --status success --limit 1 \
                  --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$DRUN" ]; then
            echo "using distilled data from run $DRUN"
            for d in general math code reason eq; do
              gh run download "$DRUN" --name "teacher-$d" --dir data \
                || echo "no teacher-$d artifact (fallback to seed corpus)"
            done
          else
            echo "no distill run yet -> 纯种子语料训练（build_all_bins 自动 fallback）"
          fi
          ls -la data/ 2>/dev/null || true

      - name: Train (CPU, 软时限双保险)
        timeout-minutes: 290
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
          OMP_NUM_THREADS: "4"
        run: |
          timeout 285m python train.py \
            --variant baseline \
            --max_steps "${{ inputs.max_steps || '400' }}" \
            --seq_len 256 \
            --global_tokens "${{ inputs.global_tokens || '16384' }}" \
            --max_minutes "${{ inputs.max_minutes || '280' }}" \
            --mix_general "0.40" \
            --mix_math "0.20" \
            --mix_code "0.20" \
            --mix_reason "0.10" \
            --mix_eq "0.10" \
            --resume

      - name: Evaluate vs SmolLM2-135M
        timeout-minutes: 20
        run: |
          timeout 18m python eval.py --out "eval_result_baseline.md"
          mv eval_status.json "eval_status_baseline.json"
          echo "---- eval_status_baseline.json ----"
          cat "eval_status_baseline.json"

      - name: Upload resume artifact (for next run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-baseline
          path: checkpoints
          retention-days: 30
          if-no-files-found: warn

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-baseline
          path: |
            eval_result_baseline.md
            eval_status_baseline.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload model assets (config.json + tokenizer_map.json, 供打包)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assets-baseline
          path: |
            config.json
            data/tokenizer_map.json
          retention-days: 30
          if-no-files-found: warn
