name: Tests (offline)

# 轻量回归保护：每次 push/PR 跑纯离线自测套件（不下载分词器、不加载检查点、
# 不触发训练）。用于快速暴露代码改动导致的崩溃，并给仓库一个可靠的测试徽章。
# 训练/打包在 train.yml / package.yml 中独立运行，互不影响。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps (no gradio)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers safetensors numpy gguf
      - name: Offline test suite (确定性离线，避免联网挂起)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python -m py_compile *.py tests/*.py
          python tests/test_offline.py
          python tests/test_export_gguf.py
          python tests/test_generate_offline.py
