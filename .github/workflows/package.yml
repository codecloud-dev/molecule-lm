name: Package & Release molecule (CPU)

# 训练完成后独立打包：导出 GGUF(f16) → 编译 llama.cpp → imatrix → 量化 q8_0/q4_K_M。
# 与训练工作流分离，各自 ≤6h；本工作流 timeout 240m。
# 触发：由 train.yml 训练成功后显式 gh workflow run 触发；也可手动 dispatch。
# 续训链为「显式互触发」：train 成功→本工作流发版→本工作流显式触发下一轮 train，闭环续训累积。
#
# 版本策略（用户要求）：
#   - 每次训练成功都建立一个「真实版本」（GitHub Release，非 draft）。
#   - 版本号由仓库根 VERSION 文件驱动，从 0.1 起逐次递增：0.1 → 0.2 → … → 0.9 → 1.0。
#   - 封顶 V1.0：到达 1.0 后不再递增（绝不出现 1.1）；v1.0 作为「滚动最佳」反复重建。
#   - 每次发版后回写 VERSION 并【自动触发下一代训练】以续训累积；
#     仓库根存在 STOP_AUTOTRAIN 文件时停止自动续训（给用户一个停止开关）。

on:
  workflow_dispatch:

permissions:
  contents: write        # 创建 Release + 回写 VERSION
  actions: write         # 自动触发下一代训练工作流

jobs:
  package:
    # 仅当手动触发，或由 train.yml 训练成功后显式 gh workflow run 触发时才打包
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240          # 预算：安装20 + 下载(10x3) + 导出15 + 编译40 + imatrix15 + 量化15 = 135m；留足网络/编译波动缓冲
    steps:
      - uses: actions/checkout@v4

      # 防御：workflow_run 触发时确保工作区同步到默认分支最新（含 VERSION 与发布脚本）。
      # 官方行为本就检出默认分支 HEAD，此步在行为边缘差异时兜住首次发版。
      - name: Sync to latest default branch
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gguf

      # 独立查找最近一次 completed 的 train run 并取其 resume 检查点：
      #   - 不依赖 github.event.workflow_run.id（train 因评测偶发异常被判 failure 时
      #     不会自动触发，但仍可手动 dispatch 打包已训好的 checkpoint）；
      #   - 手动 dispatch 也能正确定位最近的训练产物。
      - name: Find latest train run with resume artifact
        id: find
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RID=""
          for rid in $(gh run list --workflow "Train molecule (CPU)" \
                        --status completed --limit 20 \
                        --json databaseId --jq '.[].databaseId'); do
            # 用 gh api 查 artifact 名列表（gh run view 不支持 artifacts 字段），不下载。
            if timeout 30 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid/artifacts" \
                 --jq '.artifacts[].name' 2>/dev/null | grep -qx resume-baseline; then
              RID="$rid"
              echo "found resume in run $rid"
              break
            fi
          done
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          if [ -z "$RID" ]; then
            echo "⚠️ 未找到任何含 resume-baseline 的 train run"
          fi

      - name: Download baseline checkpoints
        timeout-minutes: 10
        uses: actions/download-artifact@v4
        with:
          name: resume-baseline
          path: checkpoints
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Download baseline eval status (for release notes)
        timeout-minutes: 10
        uses: actions/download-artifact@v4
        with:
          name: eval-baseline
          path: eval
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Download baseline model assets (config.json + tokenizer_map.json)
        timeout-minutes: 10
        uses: actions/download-artifact@v4
        with:
          name: assets-baseline
          path: .
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Build calibration text (for imatrix)
        timeout-minutes: 5
        run: |
          python - <<'PY'
          import sys, os
          sys.path.insert(0, ".")
          from seed_corpus import SEED
          texts = []
          for d in SEED:
              texts.extend(SEED[d])
          with open("data_calibration.txt", "w", encoding="utf-8") as f:
              for t in texts:
                  f.write(t.strip() + "\n")
          print("calibration lines:", len(texts))
          PY

      - name: Export GGUF (f16)
        timeout-minutes: 15
        run: |
          timeout 14m python export_gguf.py --ckpt checkpoints/model.safetensors \
            --out molecule-f16.gguf
          ls -lh molecule-f16.gguf

      - name: Build llama.cpp (quantize + imatrix only)
        timeout-minutes: 40
        run: |
          command -v cmake >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y cmake build-essential; }
          timeout 38m bash -c '
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git
          cd llama.cpp
          cmake -B build -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON \
                -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target llama-quantize llama-imatrix -j 4
          '

      - name: Compute imatrix
        timeout-minutes: 15
        run: |
          timeout 14m ./llama.cpp/build/bin/llama-imatrix \
            --model molecule-f16.gguf \
            --data data_calibration.txt \
            --output imatrix.bin \
            --n-gpu-layers 0 --chunk 64 || echo "imatrix skipped (non-fatal)"

      - name: Quantize q8_0 and q4_K_M (with imatrix if present)
        timeout-minutes: 15
        run: |
          QEXTRA=""
          if [ -f imatrix.bin ]; then QEXTRA="--imatrix imatrix.bin"; fi
          timeout 12m ./llama.cpp/build/bin/llama-quantize $QEXTRA \
            molecule-f16.gguf molecule-q8_0.gguf q8_0
          timeout 12m ./llama.cpp/build/bin/llama-quantize $QEXTRA \
            molecule-f16.gguf molecule-q4_K_M.gguf q4_K_M
          ls -lh molecule-*.gguf

      - name: Upload GGUF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gguf-release
          path: |
            molecule-f16.gguf
            molecule-q8_0.gguf
            molecule-q4_K_M.gguf
            imatrix.bin
          retention-days: 30
          if-no-files-found: warn

      # 每次训练成功都建立一个真实版本（替代旧的「仅全过才发 draft」逻辑）。
      # 仅当 GGUF 产出齐全才发版；发版后回写 VERSION 并自动触发下一代训练续训累积。
      - name: Release versioned model + bump + continue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 仅当 GGUF 产出齐全才发版，否则安全跳过（不发版、不续训）
          for f in molecule-f16.gguf molecule-q8_0.gguf molecule-q4_K_M.gguf; do
            if [ ! -f "$f" ]; then
              echo "缺少 $f，跳过发版与自动续训（不继续）"
              exit 0
            fi
          done

          VERSION=$(cat VERSION | tr -d '[:space:]')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          TAG="v$VERSION"
          echo "releasing $TAG (VERSION=$VERSION)"

          python make_release_notes.py

          # 若标签已存在（v1.0 滚动最佳），先删后建
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "标签 $TAG 已存在（滚动最佳），删除旧 release/tag 后重建"
            gh release delete "$TAG" -y || true
            git push --delete origin "$TAG" >/dev/null 2>&1 || true
          fi

          ASSETS="molecule-f16.gguf molecule-q8_0.gguf molecule-q4_K_M.gguf"
          [ -f imatrix.bin ] && ASSETS="$ASSETS imatrix.bin"
          gh release create "$TAG" \
            --title "molecule $TAG" \
            --notes-file notes.md \
            $ASSETS
          echo "release $TAG 完成"

          # 入库：版本说明 + 评测数据写进仓库（不只 GitHub Release）
          mkdir -p releases benchmarks
          cp notes.md "releases/${TAG}.md"
          if [ -f eval/eval_status_baseline.json ]; then
            cp eval/eval_status_baseline.json "benchmarks/${TAG}.json"
          fi

          # 版本推进（封顶 1.0）
          if [ "$MAJOR" -lt 1 ]; then
            MINOR=$((MINOR + 1))
            if [ "$MINOR" -gt 9 ]; then MAJOR=1; MINOR=0; fi
            NEXT="$MAJOR.$MINOR"
          else
            NEXT="1.0"
          fi
          echo "next VERSION=$NEXT"

          # 回写版本数据 + VERSION（[skip ci] 避免触发 train.yml 的 push 触发器）
          git config user.email "ci@codecloud.dev"
          git config user.name "molecule CI"
          git add releases benchmarks
          MSG="data: release ${TAG} notes + benchmarks"
          if [ "$NEXT" != "$VERSION" ]; then
            echo "$NEXT" > VERSION
            git add VERSION
            MSG="data: release ${TAG} + bump version to $NEXT"
          fi
          if git diff --cached --quiet; then
            echo "无新版本数据可提交，跳过 commit"
          else
            git commit -m "$MSG [skip ci]"
            git push origin HEAD:refs/heads/main
          fi

          # 继续续训累积：存在 STOP_AUTOTRAIN 则停止
          if [ -f STOP_AUTOTRAIN ]; then
            echo "STOP_AUTOTRAIN 存在：不自动打下一代训练。"
          else
            echo "自动触发下一代训练以续训累积..."
            gh workflow run train.yml
          fi
